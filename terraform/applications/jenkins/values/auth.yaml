controller:
  JCasC:
    defaultConfig: true
    securityRealm: |
      oic:
        allowTokenAccessWithoutOicSession: true
        clientId: "${jenkins-security-client-id}"
        clientSecret: "${jenkins-security-client-secret}"
        emailFieldName: "email"
        fullNameFieldName: "name"
        groupsFieldName: "groups"
        logoutFromOpenidProvider: false
        serverConfiguration:
          wellKnown:
            scopesOverride: "openid profile email"
            wellKnownOpenIDConfigurationUrl: https://homelab.example/application/o/jenkins/.well-known/openid-configuration
        userNameField: "preferred_username"
        userIdStrategy: "caseSensitive"
        groupIdStrategy: "caseSensitive"

  additionalExistingSecrets:
    - name: jenkins-security
      keyName: client-id
    - name: jenkins-security
      keyName: client-secret
