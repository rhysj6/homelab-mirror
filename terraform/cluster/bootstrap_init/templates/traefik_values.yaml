
additionalArguments:
  - --serversTransport.insecureSkipVerify=true

deployment:
  replicas: 2

ports:
  websecure:
    asDefault: true
    http:
      tls:
        enabled: true

providers:
  kubernetesCRD:
    enabled: true
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true

service:
  annotations:
    lbipam.cilium.io/ips: "${service_ip}"
    "external-dns.alpha.kubernetes.io/hostname": "traefik-public.${cluster_name}.k8s.local"
  spec:
    externalTrafficPolicy: Local

metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    addServicesLabels: true
    addRouterLabels: true
