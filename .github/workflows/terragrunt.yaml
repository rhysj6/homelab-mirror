name: Redcliff Terragrunt

on:
  pull_request:
    paths:
      - "terraform/**"
      - "terragrunt/root.hcl"
      - "terragrunt/redcliff/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "terragrunt/root.hcl"
      - "terragrunt/redcliff/**"
  workflow_dispatch:

# Prevent concurrent applies to the same environment, but allow concurrent plans
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('redcliff-terragrunt-pr-{0}', github.event.pull_request.number) || 'redcliff-terragrunt-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INFISICAL_HOST: "https://secrets.homelab.example"
  INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
  INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

  AWS_ENDPOINT_URL_S3: "https://s3.homelab.example"
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_SECRET }}
  TG_PROVIDER_CACHE: 1

jobs:
  run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed sections
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            all:
              - "terragrunt/redcliff/env.hcl"
              - "terragrunt/root.hcl"
              - "terraform/providers.tf"
              - "terraform/versions.tf"
            cluster:
              - "terraform/cluster/**"
              - "terragrunt/redcliff/cluster/**"
            observability:
              - "terraform/observability/**"
              - "terragrunt/redcliff/observability/**"
            applications:
              - "terraform/applications/**"
              - "terragrunt/redcliff/applications/**"

      - name: Setup git auth
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove any existing insteadOf entry for this URL (token changes each run so match on the value side)
          git config --global --get-regexp 'url\..*\.insteadOf' \
            | grep 'https://github.com/rhysj6/' \
            | awk '{print $1}' \
            | xargs -r -I{} git config --global --unset-all "{}" || true
          # Set fresh entry for this run
          git config --global "url.https://oauth2:${TOKEN}@github.com/rhysj6/.insteadOf" "https://github.com/rhysj6/"

      - name: Select Terragrunt command
        id: tg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "cmd=terragrunt stack run plan -- -input=false" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=terragrunt --non-interactive stack run apply -- -input=false -auto-approve" >> "$GITHUB_OUTPUT"
          fi

      - name: Cluster
        if: steps.filter.outputs.cluster == 'true' || steps.filter.outputs.all == 'true'
        working-directory: terragrunt/redcliff/cluster
        run: ${{ steps.tg.outputs.cmd }}
      - name: Applications
        if: steps.filter.outputs.applications == 'true' || steps.filter.outputs.all == 'true'
        working-directory: terragrunt/redcliff/applications
        run: ${{ steps.tg.outputs.cmd }}
        
      - name: Observability
        if: steps.filter.outputs.observability == 'true' || steps.filter.outputs.all == 'true'
        working-directory: terragrunt/redcliff/observability
        run: ${{ steps.tg.outputs.cmd }}
