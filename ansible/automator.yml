# Sets up the automator server - a dedicated VM that runs Semaphore UI (for scheduling/running Ansible playbooks)
# and a self-hosted GitHub Actions runner for the homelab CI/CD pipeline (Terragrunt apply etc.)
- name: Setup Automator Server
  hosts: automator
  become: true
  gather_facts: true
  roles:
    - role: semaphore
    - role: github_actions_runner
      vars:
        github_actions_runner_repo_url: "https://github.com/rhysj6/homelab"
        github_actions_runner_name: "homelab-runner"
        github_actions_runner_labels:
          - self-hosted
          - homelab
